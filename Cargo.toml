[workspace]
members = ["crates/orion-core", "crates/orion-server", "apps/desktop/src-tauri"]
default-members = ["crates/orion-core", "crates/orion-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
