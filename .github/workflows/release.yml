name: Release Windows installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish setup
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:setup

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Orion ${{ github.ref_name }}
          generate_release_notes: true
          files: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
